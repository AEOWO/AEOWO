name: Update V2Ray Subscription

on:
  schedule:
    - cron: '*/5 * * * *'  # هر 5 دقیقه اجرا می‌شود
  workflow_dispatch:       # امکان اجرای دستی هم دارد

jobs:
  update-subscription:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run subscription updater
        run: |
          python mahsa-free-config.py
          python make_sub.py
        env:
          GOTHUB_TOKEN: ${{ secrets.GOTHUB_TOKEN }}
